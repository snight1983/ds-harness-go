<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ds-harness-go 项目文档">
  <title>ds-harness-go 文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0f766e;
      --sidebar-name-color: #134e4a;
    }

    body {
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 45%, #f0fdfa 100%);
    }

    .sidebar {
      background: rgba(248, 250, 252, 0.96);
      border-right: 1px solid #dbe5e4;
    }

    .markdown-section code {
      color: #0f766e;
    }
  </style>
</head>
<body>
  <div id="app">文档加载中...</div>
  <script>
    window.$docsify = {
      name: 'ds-harness-go',
      repo: 'snight1983/ds-harness-go',
      homepage: 'README.md',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 4
      },
      mermaidConfig: {
        querySelector: '.mermaid'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
