# staticcheck 的仓库配置。默认全开，下面这条是唯一关掉的。
#
# ST1005「错误字符串不要大写开头、不要以标点结尾」假设错误串是英文小写片段，
# 好让 fmt.Errorf("...: %w") 串起来读得顺。这个仓库里两种字符串都不满足那个前提：
#
#   1. 内部错误一律中文。中文没有大小写，而句末的「。」「：」在 ST1005 眼里
#      就是「以标点结尾」——四百多条中文错误串会全部变红，一条真问题都不是。
#   2. 少数英文串是**给模型读的整句话**，不是给人拼接的片段。planmode 和
#      toolralph 里那些 "The user chose to keep planning; ..." 会原样进模型的
#      上下文，句首大写和句末句号是它作为一句话该有的样子。把它们改小写去句号，
#      改的是模型看到的字，不是代码风格。
#
# inherit 是 staticcheck 自己那份默认清单，只在它上面减掉 ST1005；其余检查一律
# 保持默认状态，单点例外写在代码里的 //lint:ignore 上，各自带理由。
checks = ["inherit", "-ST1005"]
